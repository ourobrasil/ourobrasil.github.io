<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouro Brasil — Legal</title>
<style>
:root{--bg:#FBF6EC;--ink:#2A1D12;--muted:#6B5A45;--gold:#B08A3E;--border:#E4D8BE;--card:#FFFFFF;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;}
.wrap{max-width:720px;margin:0 auto;padding:64px 20px 80px;}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.badge{width:44px;height:44px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;flex-shrink:0;}
h1{font-size:26px;margin:0;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;margin-top:24px;}
a.item{display:block;padding:18px 20px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);}
a.item:last-child{border-bottom:none;}
a.item:hover{background:var(--bg);}
.item b{display:block;font-size:16px;}
.item span{display:block;font-size:13px;color:var(--muted);margin-top:2px;}
footer{margin-top:40px;color:var(--muted);font-size:13px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">OB</div>
    <h1>Ouro Brasil</h1>
  </header>
  <div class="card">
    <a class="item" href="privacidade.html">
      <b>Política de Privacidade</b>
      <span>Como o app trata (ou não) dados dos usuários</span>
    </a>
    <a class="item" href="termos.html">
      <b>Termos de Uso</b>
      <span>Condições de uso do aplicativo</span>
    </a>
  </div>
  <footer>Ouro Brasil — contato: ourobrasil.app@gmail.com</footer>
</div>
</body>
</html>
